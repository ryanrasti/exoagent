<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background with rounded corners -->
  <rect x="0" y="0" width="100" height="100" fill="#0a0a0a" rx="16" ry="16" />

  <!-- Single bold ring -->
  <circle cx="50" cy="50" r="32" stroke="white" stroke-width="6" fill="none" opacity="0.7" />

  <!-- X in front -->
  <line x1="12" y1="12" x2="88" y2="88" stroke="white" stroke-width="8" opacity="0.4" />
  <line x1="88" y1="12" x2="12" y2="88" stroke="white" stroke-width="8" opacity="0.4" />

  <!-- Green dot top right, off the X -->
  <circle cx="68" cy="15" r="8" fill="#22c55e" />
</svg>
