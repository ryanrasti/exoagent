[project]
name = "exoagent-python"
version = "0.0.0"
description = "Python code mode for executing code with tool access via RPC"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

