name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: cd packages/capnweb && npm ci && npm run build
      - run: npm ci
      - run: npm run build
      - run: cd website && npm ci
      - run: cd examples && npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [lts/*]
        # omitting windows-latest (something is wrong with code-mode.test.ts)
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --recursive
      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - run: cd packages/capnweb && npm ci && npm run build
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: cd examples && npm ci &&npm run ci
