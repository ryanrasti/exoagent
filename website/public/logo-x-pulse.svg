<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Glow filter for the pulse ball -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect x="0" y="0" width="100" height="100" fill="#0a0a0a" rx="16" ry="16" />

  <!-- X breaking through the rings -->
  <line x1="12" y1="12" x2="88" y2="88" stroke="white" stroke-width="5" />
  <line x1="88" y1="12" x2="12" y2="88" stroke="white" stroke-width="5" />

  <!-- Two bold concentric rings -->
  <circle cx="50" cy="50" r="25" stroke="white" stroke-width="4" opacity="0.7" />
  <circle cx="50" cy="50" r="40" stroke="white" stroke-width="4" opacity="0.5" />

  <!-- Green pulsing/glowing ball tracing the outer ring -->
  <circle r="6" fill="#22c55e" filter="url(#glow)">
    <animateMotion dur="45s" repeatCount="indefinite" keyPoints="0.37;1;0.37" keyTimes="0;0.63;1" calcMode="linear">
      <mpath href="#outerPath" />
    </animateMotion>
    <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Hidden path for the ball to follow -->
  <circle id="outerPath" cx="50" cy="50" r="40" fill="none" stroke="none" />
</svg>
