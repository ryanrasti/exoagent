<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagonal shield: flat top, pointed bottom, no curves -->
  <path
    d="M10,8 L54,8 L54,40 L32,58 L10,40 Z"
    fill="none"
    stroke="#60a5fa"
    stroke-width="2"
  />
  <!-- Inner agent/core - pulsing glow -->
  <circle cx="32" cy="32" r="8" fill="#60a5fa" opacity="0.3">
    <animate
      attributeName="opacity"
      values="0.3;0.6;0.3"
      dur="3.5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="r"
      values="8;10;8"
      dur="3.5s"
      repeatCount="indefinite"
    />
  </circle>
  <!-- Core dot -->
  <circle cx="32" cy="32" r="4" fill="#60a5fa">
    <animate
      attributeName="opacity"
      values="1;0.7;1"
      dur="3.5s"
      repeatCount="indefinite"
    />
  </circle>
  <!-- Connection lines -->
  <line x1="32" y1="24" x2="32" y2="14" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="32" y1="40" x2="32" y2="50" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="24" y1="32" x2="14" y2="32" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="40" y1="32" x2="50" y2="32" stroke="#60a5fa" stroke-width="1.5"/>
</svg>
